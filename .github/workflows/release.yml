# Baut bei jedem Versions-Tag (z. B. v1.2.3) die ZIP-Datei und legt ein GitHub-Release an.
# WordPress findet das Release und zeigt das Update im Dashboard an.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  SLUG: sgnl-neptun
  MAIN_FILE: style.css

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Version im Code muss zum Tag passen
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          FILE_VERSION=$(grep -m1 -E '^[ *]*Version:' "$MAIN_FILE" | sed -E 's/.*Version:[[:space:]]*//' | tr -d '\r[:space:]')
          echo "Tag: $TAG_VERSION – Datei: $FILE_VERSION"
          if [ "$TAG_VERSION" != "$FILE_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME passt nicht zu 'Version: $FILE_VERSION' in $MAIN_FILE"
            exit 1
          fi

      - name: ZIP bauen
        run: |
          git archive --format=zip --prefix="$SLUG/" -o "$SLUG.zip" HEAD
          unzip -l "$SLUG.zip" | tail -1

      - name: Änderungen für die Release-Beschreibung
        run: |
          NOTES=$(git tag -l --format='%(contents)' "$GITHUB_REF_NAME" | sed '/^-----BEGIN PGP/,$d')
          if [ -z "$(echo "$NOTES" | tr -d '[:space:]')" ]; then
            PREV=$(git describe --tags --abbrev=0 "$GITHUB_REF_NAME^" 2>/dev/null || true)
            if [ -n "$PREV" ]; then RANGE="$PREV..$GITHUB_REF_NAME"; else RANGE="$GITHUB_REF_NAME"; fi
            NOTES=$(git log --no-merges --pretty='- %s' $RANGE)
          fi
          printf '%s\n' "$NOTES" > notes.md
          cat notes.md

      - name: Release anlegen
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "$SLUG.zip" --title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag
