# Automatische Releases:
# Sobald auf "main" eine neue Versionsnummer in style.css steht, baut diese Action
# die ZIP-Datei und legt das GitHub-Release v<Version> an. WordPress zeigt das
# Update danach unter Dashboard → Aktualisierungen an.
# Ohne neue Versionsnummer passiert nichts.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  SLUG: sgnl-neptun
  MAIN_FILE: style.css

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Version lesen
        id: v
        run: |
          VERSION=$(grep -m1 -E '^[ *]*Version:' "$MAIN_FILE" | sed -E 's/.*Version:[[:space:]]*//' | tr -d '\r[:space:]')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Version $VERSION ist schon veröffentlicht – nichts zu tun."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Neue Version $VERSION wird veröffentlicht."
          fi

      - name: ZIP bauen
        if: steps.v.outputs.exists == 'false'
        run: |
          git archive --format=zip --prefix="$SLUG/" -o "$SLUG.zip" HEAD
          unzip -l "$SLUG.zip" | tail -1

      - name: Änderungen seit der letzten Version
        if: steps.v.outputs.exists == 'false'
        run: |
          PREV=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)
          if [ -n "$PREV" ]; then RANGE="$PREV..HEAD"; else RANGE="HEAD"; fi
          git log --no-merges --pretty='- %s' $RANGE | grep -v -i '^- release-workflow' > notes.md || true
          [ -s notes.md ] || echo "- Version ${{ steps.v.outputs.version }}" > notes.md
          cat notes.md

      - name: Release anlegen
        if: steps.v.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ steps.v.outputs.tag }}" "$SLUG.zip" --target "$GITHUB_SHA" --title "${{ steps.v.outputs.tag }}" --notes-file notes.md
